<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Hexagonal Nexus -->
  <polygon points="16,3 28,10 28,22 16,29 4,22 4,10" stroke="url(#logo-grad)" stroke-width="2" fill="rgba(0, 210, 255, 0.08)" filter="url(#glow)"/>
  <!-- Internal Connected Orbitals -->
  <circle cx="16" cy="16" r="4.5" fill="url(#logo-grad)" />
  <line x1="16" y1="3" x2="16" y2="11.5" stroke="#00d2ff" stroke-width="1.8" stroke-dasharray="2 2" />
  <line x1="28" y1="22" x2="19.5" y2="18" stroke="#8b5cf6" stroke-width="1.8" />
  <line x1="4" y1="22" x2="12.5" y2="18" stroke="#00d2ff" stroke-width="1.8" />
  <circle cx="16" cy="3" r="2" fill="#00d2ff" />
  <circle cx="28" cy="10" r="1.8" fill="#8b5cf6" />
  <circle cx="28" cy="22" r="1.8" fill="#8b5cf6" />
  <circle cx="16" cy="29" r="1.8" fill="#8b5cf6" />
  <circle cx="4" cy="22" r="1.8" fill="#00d2ff" />
  <circle cx="4" cy="10" r="1.8" fill="#00d2ff" />
</svg>
