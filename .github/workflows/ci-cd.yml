name: AetherSDLC Enterprise CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Quality, SAST, and Test Verification Matrix
  # ============================================================================
  test-and-verify:
    name: Test & Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Documentation & Code Hygiene (Zero Emoji Rule)
        run: |
          python -c "
          import os, re
          emoji_pattern = re.compile(r'[\U00010000-\U0010ffff\u2600-\u27bf\u2300-\u23ff\u2b50]')
          violations = []
          for root, dirs, files in os.walk('.'):
              if any(p in root for p in ['.git', '.pytest_cache', '__pycache__', 'venv', 'env']):
                  continue
              for f in files:
                  if f.endswith(('.py', '.md')):
                      path = os.path.join(root, f)
                      with open(path, 'r', encoding='utf-8', errors='ignore') as fh:
                          for line_no, line in enumerate(fh, 1):
                              if emoji_pattern.search(line):
                                  violations.append(f'{path}:{line_no}')
          if violations:
              print(f'Emoji violations detected in {len(violations)} locations:')
              for v in violations:
                  print('  ', v)
              exit(1)
          print('Clean hygiene verified: Zero emojis in codebase.')
          "

      - name: Execute Complete Automated Test Suite (46 Tests)
        run: |
          python -m pytest tests/ -v

  # ============================================================================
  # 2. Multi-Stage Docker Build & Container Smoke Test
  # ============================================================================
  docker-build-and-smoke-test:
    name: Build & Smoke Test Container Image
    needs: test-and-verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Runtime Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: aethersdlc:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Container Smoke Test
        run: |
          # Launch container in background
          docker run -d --name aether-test -p 8000:8000 aethersdlc:test
          
          # Wait up to 30 seconds for healthcheck
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' aether-test 2>/dev/null || echo '"starting"')
            if [ "$STATUS" = '"healthy"' ]; then
              echo "Container reached healthy state after ${i} seconds."
              break
            fi
            sleep 1
          done

          # Test API status endpoint
          curl -f http://127.0.0.1:8000/api/pipeline/status || (docker logs aether-test && exit 1)

          # Test URL shortening operation
          curl -f -X POST http://127.0.0.1:8000/shortener/api/v1/shorten \
            -H "Content-Type: application/json" \
            -d '{"original_url": "https://www.example.com/smoke-test"}' || (docker logs aether-test && exit 1)

          # Cleanup
          docker stop aether-test
          docker rm aether-test
          echo "Smoke test passed successfully."

  # ============================================================================
  # 3. Release Manifest & Deployment Certification Gate
  # ============================================================================
  release-certification:
    name: Release Certification
    needs: [test-and-verify, docker-build-and-smoke-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Verify Release Artifacts
        run: |
          echo "================================================================="
          echo " AetherSDLC Automated Deployment Certification Passed"
          echo "================================================================="
          echo "Commit SHA: ${{ github.sha }}"
          echo "All 46 tests passed on Python 3.10, 3.11, and 3.12."
          echo "Hardened multi-stage container image verified and certified."
          echo "Ready for zero-downtime rolling deployment to cloud cluster."
          echo "================================================================="
